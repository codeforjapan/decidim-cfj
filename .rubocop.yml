inherit_gem:
  decidim-dev: rubocop-decidim.yml

AllCops:
  Exclude:
    - "db/migrate/*"
    - "db/schema.rb"
    - "db/data_schema.rb"
    - "bin/setup"
    - "bin/update"
    - "node_modules/**/*"
    - "vendor/bundle/**/*"

# 上流 decidim-dev と同じく、システム管理者の認証で守られる /system は対象外にする
Decidim/EnforcePermissionTo:
  Exclude:
    - "app/controllers/decidim/system/**/*.rb"

Gemspec/RequiredRubyVersion:
  Enabled: false

Rails/Output:
  Enabled: false

Capybara/ClickLinkOrButtonStyle:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

Rails/I18nLocaleAssignment:
  Enabled: false

RSpecRails/NegationBeValid:
  Exclude:
    - spec/shared/proposal_form_examples.rb

RSpec/IndexedLet:
  Enabled: false
